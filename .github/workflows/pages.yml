name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/vendor/paper-shaders.js
      - src/vendor/paper-shaders.LICENSE
      - src/vendor/paper-shaders.NOTICE
      - fonts/**
      - icons/icon-256.png
      - scripts/build-site.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
