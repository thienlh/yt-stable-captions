<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker Marks Playground</title>
<style>
  :root {
    --bg: #f4f4f2;
    --panel: #ffffff;
    --ink: #1c1c1e;
    --muted: #6b6b70;
    --line: #dcdcd8;
    --accent: #d93025;
    --host: #4f9dff;
    --guest: #ff9f43;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --panel: #1b1b1f;
      --ink: #ececef;
      --muted: #9a9aa2;
      --line: #2e2e34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    display: grid;
    gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  h1 { font-size: 16px; margin: 0; margin-right: auto; }
  button, select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 76px; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; }
  .speaking { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-weight: 600;
    color: #fff;
    background: var(--muted);
    transition: background 120ms;
  }
  .hint { color: var(--muted); font-size: 12px; }
  kbd {
    font: 11px ui-monospace, monospace;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 4px;
  }

  main {
    padding: 16px;
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card.focus { grid-column: 1 / -1; }
  .card-head { padding: 10px 12px 8px; display: flex; gap: 8px; align-items: baseline; }
  .card-head b { font-size: 14px; }
  .card-head .tag { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .card p { margin: 0; padding: 0 12px 10px; color: var(--muted); font-size: 12.5px; min-height: calc(2 * 1.45em + 10px); }
  .card { display: flex; flex-direction: column; }
  .card .player { margin-top: auto; }
  .card.recommended .card-head b::after {
    content: "suggested";
    margin-left: 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
  }

  /* Fake video frame */
  .player {
    position: relative;
    aspect-ratio: 16 / 9;
    background:
      radial-gradient(ellipse at 30% 35%, #4b5d6b 0%, transparent 55%),
      radial-gradient(ellipse at 75% 60%, #6b4f3f 0%, transparent 50%),
      linear-gradient(160deg, #26313a, #15181c);
    cursor: zoom-in;
    overflow: hidden;
  }
  .card.focus .player { cursor: zoom-out; }

  /* Mirrors src/content/styles.css (#ytsc-overlay), as a class so several can coexist */
  .ytsc-cap {
    --ytsc-font: 28px;
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(80%, 14em);
    display: none;
    pointer-events: none;
    text-align: center;
    font-family: "Montserrat", "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: var(--ytsc-font);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow:
      -0.06em -0.06em 0 #000, 0.06em -0.06em 0 #000,
      -0.06em 0.06em 0 #000, 0.06em 0.06em 0 #000,
      0 0.08em 0 #000, 0 0.12em 0.25em rgba(0, 0, 0, 0.6);
    overflow-wrap: anywhere;
  }
  .ytsc-cap.visible { display: block; }
  .ytsc-cap.pop { animation: ytsc-pop 140ms ease-out; }
  .ytsc-cap .w { display: inline-block; transition: color 80ms linear, transform 80ms ease-out; }
  .ytsc-cap .w.active { color: #ffe135; transform: scale(1.08); }
  .ytsc-cap .dash { opacity: 0.75; margin-right: 0.15em; }
  .ytsc-cap.spk-1 .w:not(.active) { color: #bfe0ff; }
  .ytsc-cap.spk-0 .w:not(.active) { color: #fff; }
  @keyframes ytsc-pop {
    from { opacity: 0; transform: translateX(-50%) scale(0.85); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  /* YouTube native reference */
  .native {
    position: absolute;
    left: 50%;
    bottom: 10%;
    transform: translateX(-50%);
    width: 80%;
    display: grid;
    justify-items: center;
    gap: 2px;
    font: 500 var(--ytsc-font, 20px)/1.25 "YouTube Noto", Roboto, Arial, sans-serif;
    font-size: calc(var(--ytsc-font, 28px) * 0.72);
    color: #fff;
    pointer-events: none;
  }
  .native span { background: rgba(8, 8, 8, 0.75); padding: 0 0.25em; white-space: pre; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Speaker marks (<code>&gt;&gt;</code>) playground</h1>
    <label>Sample
      <select id="sample">
        <option value="interview">Interview, 2 speakers (real speaker changes)</option>
        <option value="solo">Solo vlog (false &gt;&gt; mid-sentence)</option>
      </select>
    </label>
    <label>Speed
      <select id="rate">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="play" class="primary">Play</button>
    <button id="restart" title="Restart">⟲</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 0:00</span>
    <span class="speaking">Speaking now: <span class="pill" id="who">—</span></span>
  </div>
  <div class="hint">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> seek 3s · click a player to enlarge it.
    Uses the real <code>src/core</code> parser + chunker on a synthetic YouTube ASR (json3) track.
  </div>
</header>

<main id="grid"></main>

<script src="../src/core/text-utils.js"></script>
<script src="../src/core/rolling-merger.js"></script>
<script src="../src/core/json3-parser.js"></script>
<script src="../src/core/cue-lookup.js"></script>
<script src="../src/core/chunker.js"></script>
<script>
(() => {
  'use strict';
  const { Json3Parser, CaptionChunker, cueAtTime } = globalThis.YTSC;

  // ---------- Samples: utterances -> YouTube-style ASR json3 ----------

  const SAMPLES = {
    interview: {
      speakers: ['Host', 'Guest'],
      // ASR often drops punctuation at turn changes (lowercase lines below).
      utterances: [
        { spk: 0, text: ">> Welcome back to the show. Today I'm joined by a chef who cooks only with fire." },
        { spk: 1, text: ">> Thanks for having me. It's great to be here." },
        { spk: 0, text: ">> So why fire? Most people just use a stove." },
        { spk: 1, text: ">> Honestly, it started as a mistake. My oven broke the week we opened." },
        { spk: 0, text: ">> no way" },
        { spk: 1, text: ">> yeah so we built a grill in the parking lot, and people loved it." },
        { spk: 0, text: ">> And that became the whole restaurant?" },
        { spk: 1, text: ">> pretty much >> wow >> we never fixed the oven", spkMap: [1, 0, 1] },
        { spk: 0, text: ">> Okay, I have to try this food after the show." },
      ],
    },
    solo: {
      speakers: ['Vlogger'],
      utterances: [
        { spk: 0, text: ">> Hey everyone, so today we're going to >> fix this old bike I found on the street." },
        { spk: 0, text: "First thing, the chain is completely rusted, so we'll soak it overnight." },
        { spk: 0, text: "Then the brakes. Honestly, these brakes >> are the scariest part of the whole thing." },
        { spk: 0, text: "If you like this kind of video, let me know in the comments." },
      ],
    },
  };

  function tokenize(sample) {
    const words = [];
    let t = 700;
    sample.utterances.forEach((u, ui) => {
      if (ui) t += 550;
      let seg = -1;
      for (const text of u.text.split(' ')) {
        if (text === '>>') {
          seg++;
          if (u.spkMap && seg) t += 350;
          words.push({ text, t, spk: u.spkMap ? u.spkMap[seg] : u.spk, marker: true });
          continue;
        }
        const spk = u.spkMap ? u.spkMap[Math.max(0, seg)] : u.spk;
        words.push({ text, t, spk });
        t += 150 + 38 * text.length + (/[.?!]$/.test(text) ? 260 : /,$/.test(text) ? 140 : 0);
      }
    });
    return { words, duration: t + 1500 };
  }

  /** Group words into ~32-char rollup rows, emitted like YouTube ASR json3. */
  function toJson3(words) {
    const rows = [];
    let row = [];
    let chars = 0;
    for (const w of words) {
      if (row.length && chars + w.text.length + 1 > 32) {
        rows.push(row);
        row = [];
        chars = 0;
      }
      row.push(w);
      chars += w.text.length + 1;
    }
    if (row.length) rows.push(row);

    const events = [{ tStartMs: 0, dDurationMs: 999999, wWinId: 0 }];
    rows.forEach((r, i) => {
      const start = r[0].t;
      const next = rows[i + 1]?.[0].t;
      const end = next != null ? next + 2500 : r[r.length - 1].t + 2500;
      events.push({
        tStartMs: start,
        dDurationMs: end - start,
        wWinId: 1,
        segs: r.map((w, j) => (j ? { utf8: ` ${w.text}`, tOffsetMs: w.t - start } : { utf8: w.text })),
      });
      if (next != null) events.push({ tStartMs: next - 10, dDurationMs: 2500, wWinId: 1, aAppend: 1, segs: [{ utf8: '\n' }] });
    });
    return { json3: { events }, rows };
  }

  // ---------- Speaker-mark handling (the approaches under test) ----------

  const MARK = /^(>{2,})(.*)$/;

  /** Drops >> tokens; tags words with a speaker index and marks the first word after a change. */
  function stripMarks(words) {
    const out = [];
    let speaker = 0;
    let pending = false;
    for (const w of words) {
      let text = w.text;
      const m = text.match(MARK);
      if (m) {
        if (out.length) speaker++;
        pending = true;
        text = m[2];
        if (!text) continue;
      }
      out.push({ ...w, text, speaker, speakerStart: pending });
      pending = false;
    }
    return out;
  }

  function chunker({ breakOnSpeaker }) {
    const c = new CaptionChunker();
    if (breakOnSpeaker) {
      const base = c.rules.breakBefore.bind(c.rules);
      c.rules.breakBefore = (current, next) => base(current, next) || (current.length > 0 && !!next.speakerStart);
    }
    return c;
  }

  const VARIANTS = [
    {
      id: 'native',
      name: 'YouTube native',
      tag: 'reference',
      desc: 'What YouTube shows: rolling rows, words appear one by one, >> kept.',
      native: true,
    },
    {
      id: 'raw',
      name: 'A · Current extension',
      tag: 'no change',
      desc: '>> is treated as a word. Watch it sit at the front of chunks.',
      build: (words) => chunker({}).build(words),
    },
    {
      id: 'strip',
      name: 'B · Strip only',
      tag: 'hide >>',
      desc: '>> removed, nothing else. Without punctuation, two speakers share a chunk ("no way yeah so we…").',
      build: (words) => chunker({}).build(stripMarks(words)),
    },
    {
      id: 'break',
      name: 'C · Strip + break',
      tag: 'hide >>, new chunk',
      desc: 'Each speaker change starts a new chunk. In the solo sample, false >> cut sentences in half.',
      build: (words) => chunker({ breakOnSpeaker: true }).build(stripMarks(words)),
      recommended: true,
    },
    {
      id: 'dash',
      name: 'D · Break + dash',
      tag: 'subtitle convention',
      desc: 'Like C, plus a dash on the first chunk of a new speaker (film-subtitle style).',
      build: (words) => chunker({ breakOnSpeaker: true }).build(stripMarks(words)),
      dash: true,
    },
    {
      id: 'colour',
      name: 'E · Break + colour',
      tag: 'alternating tint',
      desc: 'Like C, alternating white / light blue per speaker turn. Current word stays yellow.',
      build: (words) => chunker({ breakOnSpeaker: true }).build(stripMarks(words)),
      colour: true,
    },
  ];

  // ---------- Rendering ----------

  class CaptionCard {
    constructor(variant, grid) {
      this.v = variant;
      this.el = document.createElement('section');
      this.el.className = `card${variant.recommended ? ' recommended' : ''}`;
      this.el.innerHTML = `
        <div class="card-head"><b></b><span class="tag"></span></div>
        <p></p>
        <div class="player"><div class="${variant.native ? 'native' : 'ytsc-cap'}"></div></div>`;
      this.el.querySelector('b').textContent = variant.name;
      this.el.querySelector('.tag').textContent = variant.tag;
      this.el.querySelector('p').textContent = variant.desc;
      this.player = this.el.querySelector('.player');
      this.cap = this.player.firstElementChild;
      this.player.addEventListener('click', () => {
        this.el.classList.toggle('focus');
        this.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      new ResizeObserver(() => {
        const px = Math.max(12, Math.round(this.player.clientHeight * 0.06));
        this.cap.style.setProperty('--ytsc-font', `${px}px`);
      }).observe(this.player);
      grid.appendChild(this.el);
    }

    load(data) {
      this.data = data;
      this.chunks = this.v.build ? this.v.build(data.words) : [];
      this.current = undefined;
      this.cap.textContent = '';
      this.cap.classList.remove('visible');
    }

    render(t) {
      if (this.v.native) return this._renderNative(t);
      const chunk = cueAtTime(this.chunks, t);
      if (chunk !== this.current) this._paint(chunk);
      if (!chunk) return;
      let active = -1;
      chunk.words.forEach((w, i) => { if (w.startMs <= t) active = i; });
      if (active !== this.active) {
        this.spans[this.active]?.classList.remove('active');
        this.spans[active]?.classList.add('active');
        this.active = active;
      }
    }

    _paint(chunk) {
      this.current = chunk;
      this.active = -1;
      this.spans = [];
      const cap = this.cap;
      cap.textContent = '';
      cap.classList.remove('spk-0', 'spk-1', 'pop');
      if (!chunk) {
        cap.classList.remove('visible');
        return;
      }
      if (this.v.dash && chunk.words[0].speakerStart) {
        const d = document.createElement('span');
        d.className = 'dash';
        d.textContent = '–';
        cap.append(d, ' ');
      }
      if (this.v.colour) cap.classList.add(`spk-${(chunk.words[0].speaker || 0) % 2}`);
      chunk.words.forEach((w, i) => {
        if (i) cap.append(' ');
        const s = document.createElement('span');
        s.className = 'w';
        s.textContent = w.text;
        cap.append(s);
        this.spans.push(s);
      });
      cap.classList.add('visible');
      void cap.offsetWidth;
      cap.classList.add('pop');
    }

    _renderNative(t) {
      const rows = this.data.rows;
      let r = -1;
      for (let i = 0; i < rows.length && rows[i][0].t <= t; i++) r = i;
      const lastT = r >= 0 ? rows[r][rows[r].length - 1].t : -1;
      const visible = r >= 0 && t < lastT + 2500 ? rows.slice(Math.max(0, r - 1), r + 1) : [];
      const key = visible.map((row) => row.filter((w) => w.t <= t).length).join(',') + ':' + r;
      if (key === this.nativeKey) return;
      this.nativeKey = key;
      this.cap.textContent = '';
      for (const row of visible) {
        const span = document.createElement('span');
        span.textContent = row.filter((w) => w.t <= t).map((w) => w.text).join(' ');
        if (span.textContent) this.cap.appendChild(span);
      }
    }
  }

  // ---------- Transport ----------

  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const cards = VARIANTS.map((v) => new CaptionCard(v, grid));
  const clock = { t: 0, playing: false, last: 0, rate: 1, duration: 1 };
  let data = null;

  function loadSample(name) {
    const sample = SAMPLES[name];
    const { words, duration } = tokenize(sample);
    const { json3, rows } = toJson3(words);
    // Real pipeline: json3 -> timed words (parser) -> chunks (chunker, per variant).
    data = { sample, source: words, rows, words: new Json3Parser().parseWords(json3) };
    clock.duration = duration;
    clock.t = 0;
    cards.forEach((c) => c.load(data));
    draw();
  }

  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  const SPK_COLORS = ['var(--host)', 'var(--guest)'];
  function draw() {
    const t = clock.t;
    cards.forEach((c) => c.render(t));
    $('seek').value = Math.round((t / clock.duration) * 1000);
    $('time').textContent = `${fmt(t)} / ${fmt(clock.duration)}`;
    let spk = null;
    for (const w of data.source) {
      if (w.t > t) break;
      if (!w.marker) spk = w.spk;
    }
    const who = $('who');
    who.textContent = spk == null ? '—' : data.sample.speakers[spk];
    who.style.background = spk == null ? '' : SPK_COLORS[spk];
  }

  function setPlaying(on) {
    if (on && clock.t >= clock.duration) clock.t = 0;
    clock.playing = on;
    clock.last = performance.now();
    $('play').textContent = on ? 'Pause' : 'Play';
  }

  function frame(now) {
    if (clock.playing) {
      clock.t += (now - clock.last) * clock.rate;
      if (clock.t >= clock.duration) {
        clock.t = clock.duration;
        setPlaying(false);
      }
      draw();
    }
    clock.last = now;
    requestAnimationFrame(frame);
  }

  const seekBy = (ms) => {
    clock.t = Math.min(clock.duration, Math.max(0, clock.t + ms));
    draw();
  };

  $('play').addEventListener('click', () => setPlaying(!clock.playing));
  $('restart').addEventListener('click', () => { clock.t = 0; setPlaying(true); });
  $('seek').addEventListener('input', (e) => {
    clock.t = (Number(e.target.value) / 1000) * clock.duration;
    draw();
  });
  $('rate').addEventListener('change', (e) => { clock.rate = Number(e.target.value); });
  $('sample').addEventListener('change', (e) => { setPlaying(false); loadSample(e.target.value); });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('select, input')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!clock.playing); }
    if (e.code === 'ArrowLeft') seekBy(-3000);
    if (e.code === 'ArrowRight') seekBy(3000);
  });

  // ?sample=solo&t=12000 opens a specific moment.
  const params = new URLSearchParams(location.search);
  if (SAMPLES[params.get('sample')]) $('sample').value = params.get('sample');
  loadSample($('sample').value);
  if (params.has('t')) seekBy(Number(params.get('t')) || 0);
  window.__playground = { cards, get data() { return data; } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
