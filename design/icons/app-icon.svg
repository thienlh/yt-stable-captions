<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app icon: icon.svg on Apple's 1024 grid (824 px body, 100 px margin) with the standard soft shadow. -->
  <defs><filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1a2038" filter="url(#drop)"/>
  <g transform="translate(100 100) scale(0.8046875)">
  <!-- Stable Captions: still water at dusk (the video), a frosted caption panel, one word lit. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2038"/>
      <stop offset="0.38" stop-color="#34477c"/>
      <stop offset="0.56" stop-color="#7e9cd8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c639f"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fbf6e2"/>
      <stop offset="1" stop-color="#e6dcb8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e9c6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3e9c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="566"/></clipPath>
    <clipPath id="panelClip"><rect x="140" y="690" width="744" height="190" rx="56"/></clipPath>
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <g id="scene">
      <rect width="1024" height="1024" fill="url(#sky)"/>
      <circle cx="512" cy="480" r="240" fill="url(#glow)"/>
      <circle cx="512" cy="470" r="128" fill="url(#sun)" clip-path="url(#above)"/>
      <rect y="566" width="1024" height="458" fill="url(#sea)"/>
      <rect y="564" width="1024" height="4" fill="#f3e9c6" opacity="0.5"/>
      <!-- reflection: flat, unbroken lines; the water is still -->
      <g fill="#f3e9c6">
        <rect x="387" y="586" width="250" height="9" rx="4.5" opacity="0.7"/>
        <rect x="417" y="610" width="190" height="8" rx="4" opacity="0.5"/>
        <rect x="447" y="632" width="130" height="7" rx="3.5" opacity="0.38"/>
        <rect x="474" y="652" width="76" height="6" rx="3" opacity="0.28"/>
        <rect x="494" y="670" width="36" height="5" rx="2.5" opacity="0.2"/>
      </g>
    </g>
  </defs>
  <g clip-path="url(#body)">
    <clipPath id="body"><rect width="1024" height="1024" rx="228"/></clipPath>
    <use xlink:href="#scene"/>
    <!-- frosted caption panel -->
    <g clip-path="url(#panelClip)">
      <use xlink:href="#scene" filter="url(#frost)"/>
      <rect x="140" y="690" width="744" height="190" fill="#12141d" opacity="0.42"/>
      <rect x="140" y="690" width="744" height="95" fill="url(#sheen)"/>
    </g>
    <rect x="141" y="691" width="742" height="188" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <!-- a stable chunk of three words, the spoken one lit -->
    <rect x="212" y="762" width="168" height="46" rx="23" fill="#c9d4f0" opacity="0.5"/>
    <rect x="408" y="762" width="236" height="46" rx="23" fill="#ffffff"/>
    <rect x="672" y="762" width="140" height="46" rx="23" fill="#c9d4f0" opacity="0.5"/>
  </g>
</g>
</svg>
