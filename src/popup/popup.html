<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YT Stable Captions</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="title">
      <h1>Stable Captions</h1>
      <span class="status" id="status"><i></i><span id="status-text">Not on YouTube</span></span>
      <button class="pill small grant" id="grant" hidden>Allow on YouTube</button>
    </header>

    <section>
      <div class="eyebrow">Style</div>
      <div class="cards">
        <button class="style-card" data-style="frosted" aria-pressed="false">
          <svg class="wash" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true">
            <path fill="currentColor" opacity=".12" d="M6 74C0 26 54 4 98 22s58-16 104 4 62-20 112 6 84 24 72 68-68 28-114 36-86-14-134 2-96-8-132-28Z"/>
            <path fill="currentColor" opacity=".08" d="M24 60C42 10 98 36 130 30s62 14 96-2 80-2 122 20 24 62-16 68-78 20-120 0-60 20-104 2S10 100 24 60Z"/>
            <g fill="currentColor" opacity=".3"><circle cx="33" cy="30" r="3"/><circle cx="364" cy="26" r="2.5"/></g>
          </svg>
          <div class="pv" data-preview="frosted"></div>
          <span class="sc-name"><b>Frosted</b><small>calm</small><i class="check">✓</i></span>
        </button>
        <button class="style-card" data-style="tiktok" aria-pressed="false">
          <svg class="wash" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true">
            <path fill="currentColor" opacity=".12" d="M6 74C0 26 54 4 98 22s58-16 104 4 62-20 112 6 84 24 72 68-68 28-114 36-86-14-134 2-96-8-132-28Z"/>
            <path fill="currentColor" opacity=".08" d="M24 60C42 10 98 36 130 30s62 14 96-2 80-2 122 20 24 62-16 68-78 20-120 0-60 20-104 2S10 100 24 60Z"/>
            <g fill="currentColor" opacity=".3"><circle cx="33" cy="30" r="3"/><circle cx="364" cy="26" r="2.5"/></g>
          </svg>
          <div class="pv" data-preview="tiktok"></div>
          <span class="sc-name"><b>Short</b><small>fun</small><i class="check">✓</i></span>
        </button>
      </div>
      <div class="meta"><span id="meta"></span><span id="meta-clean"></span></div>
    </section>

    <section>
      <div class="eyebrow">Text size</div>
      <div class="stepper">
        <button class="pill step" data-size-step="-1" aria-label="Smaller text">−</button>
        <span class="dots" id="size-dots"></span>
        <button class="pill step" data-size-step="1" aria-label="Larger text">+</button>
        <output id="size-label"></output>
      </div>
    </section>

    <section>
      <div class="eyebrow" id="window-title"></div>
      <div class="row" id="window-list"></div>
    </section>

    <section class="toggle-row">
      <div>
        <div class="eyebrow flush">Clean verbatim</div>
        <small>Hide um, uh and “I I I” stumbles</small>
      </div>
      <button class="pill" id="clean" aria-pressed="false"></button>
    </section>

    <footer class="keys" aria-label="Keyboard shortcuts on the video">
      <span><kbd>C</kbd> captions</span>
      <span><kbd>+ −</kbd> size</span>
      <span><kbd>W</kbd> background</span>
      <span><kbd>⇧C</kbd> clean</span>
      <span><kbd>⌥C</kbd> style</span>
    </footer>

    <svg class="watermark" viewBox="0 0 120 90" aria-hidden="true">
      <path d="M14 6h92a10 10 0 0 1 10 10v44a10 10 0 0 1-10 10H52L30 86V70H14A10 10 0 0 1 4 60V16A10 10 0 0 1 14 6Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
      <path d="M50 30c-2-3-5-4-8-4-5 0-8 2.5-8 6 0 8 16 4 16 12 0 3.5-3 6-8 6-3.5 0-6.5-1.2-8.5-4M84 30a12 12 0 1 0 0 16" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </main>

  <script src="../core/settings.js"></script>
  <script src="../core/text-utils.js"></script>
  <script src="../core/cue-lookup.js"></script>
  <script src="../core/chunker.js"></script>
  <script src="../core/disfluency.js"></script>
  <script src="popup.js"></script>
</body>
</html>
