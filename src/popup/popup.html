<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stable Captions</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="popup">
    <header class="title">
      <h1>Stable Captions</h1>
      <span class="status" id="status"><i></i><span id="status-text">Not on YouTube</span></span>
      <button class="grant" id="grant" hidden>Allow on YouTube</button>
    </header>

    <section class="cards" aria-label="Caption style">
      <button class="style-card" data-style="frosted" aria-pressed="false">
        <div class="pv" data-preview="frosted"></div>
        <span class="sc-name"><b>Frosted</b><small>calm</small><i class="check" aria-hidden="true"></i></span>
      </button>
      <button class="style-card" data-style="tiktok" aria-pressed="false">
        <div class="pv" data-preview="tiktok"></div>
        <span class="sc-name"><b>Short</b><small>fun</small><i class="check" aria-hidden="true"></i></span>
      </button>
    </section>

    <section class="group">
      <div class="row">
        <div class="label">
          <div class="name">Text size <kbd>− +</kbd></div>
          <output class="hint" id="size-label"></output>
        </div>
        <div class="stepper">
          <button class="step" data-size-step="-1" aria-label="Smaller text">−</button>
          <span class="bars" id="size-dots" aria-hidden="true"></span>
          <button class="step" data-size-step="1" aria-label="Larger text">+</button>
        </div>
      </div>

      <div class="row stack">
        <div class="name"><span id="window-title"></span> <kbd>W</kbd></div>
        <div class="seg" id="window-list" role="group" aria-labelledby="window-title"></div>
      </div>

      <div class="row">
        <div class="label">
          <div class="name" id="clean-label">Clean verbatim <kbd>⇧C</kbd></div>
          <div class="hint">Hide um, uh and “I I I” stumbles</div>
        </div>
        <button class="switch" id="clean" role="switch" aria-checked="false" aria-labelledby="clean-label"></button>
      </div>
    </section>

    <footer class="keys" aria-label="Keyboard shortcuts on the video">
      <span><kbd>C</kbd> captions on/off</span>
      <span><kbd>⌥C</kbd> switch style</span>
    </footer>
  </main>

  <script src="../core/settings.js"></script>
  <script src="../core/text-utils.js"></script>
  <script src="../core/cue-lookup.js"></script>
  <script src="../core/chunker.js"></script>
  <script src="../core/disfluency.js"></script>
  <script src="popup.js"></script>
  <script src="../vendor/paper-shaders.js"></script>
  <script src="backdrop.js"></script>
</body>
</html>
